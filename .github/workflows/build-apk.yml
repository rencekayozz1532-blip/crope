name: Build CROPE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Collect web files
        run: |
          mkdir -p www
          cp index.html www/
          for f in manifest.webmanifest icon-192.png icon-512.png sw.js; do
            [ -f "$f" ] && cp "$f" www/ || true
          done

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init CROPE com.crope.camera --web-dir=www
          npx cap add android

      - name: Add camera permission
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          add = ('<uses-permission android:name="android.permission.CAMERA" />\n'
                 '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
                 '    ')
          s = s.replace('<application', add + '<application', 1)
          open(p, 'w').write(s)
          PY
          grep -n "CAMERA" android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: crope-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
