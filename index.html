<html lang="en">
<head>

<style>
:root{--bg:#000;--fg:#fff;--accent:#ffcf4a;--warn:#ff8a7a;--glass:rgba(20,20,22,.66);--sheet:#0b0c0e;--sheet-fg:#f5f6f8;--muted:#9aa4b2;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#v,#g{position:fixed;inset:0;width:100%;height:100%}
#v{object-fit:cover;background:#000;opacity:0;transition:opacity .3s}
#v.live{opacity:1}
#v::-webkit-media-controls,#v::-webkit-media-controls-start-playback-button,#v::-webkit-media-controls-overlay-play-button{display:none!important;-webkit-appearance:none}
#g{pointer-events:none}

/* top bar */
header{position:fixed;top:0;left:0;right:0;z-index:2;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 22px;display:flex;justify-content:center;align-items:center;background:linear-gradient(rgba(0,0,0,.5),transparent);pointer-events:none}
header>*{pointer-events:auto}
.pill{height:38px;min-width:72px;padding:0 16px;border-radius:999px;background:var(--glass);font-size:13px;font-weight:600;letter-spacing:.04em;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .2s,color .2s}
.pill::before{content:none}
#auto::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5}
#auto[aria-pressed="true"]{background:var(--accent);color:#1a1500}
#auto[aria-pressed="true"]::before{opacity:1}

/* guidance */
#hint{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 148px);margin:auto;width:fit-content;max-width:calc(100% - 32px);padding:9px 16px;border-radius:999px;background:var(--glass);font-size:14px;font-weight:600;text-align:center;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none}
#hint.show{opacity:1;transform:none}
#hint.good{background:var(--accent);color:#1a1500}

/* controls */
footer{position:fixed;bottom:0;left:0;right:0;z-index:2;padding:22px 32px calc(env(safe-area-inset-bottom,0px) + 24px);display:grid;grid-template-columns:1fr 88px 1fr;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.7) 45%)}
#thumb{grid-column:1}
#shutter{grid-column:2}
#ratio.round{grid-column:3;justify-self:end;width:54px;height:54px;min-width:0;padding:0;border-radius:50%;font-size:13px;border:1.5px solid rgba(255,255,255,.35)}
#ratio.round:active{transform:scale(.94)}
#thumb:active{transform:scale(.94)}
#thumb{box-shadow:0 2px 12px rgba(0,0,0,.5)}
.pill{background-image:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.16);box-shadow:0 2px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);-webkit-user-select:none}
.pill:active{transform:scale(.96)}
#auto::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-1px,-1px);opacity:.7;margin-left:2px}
#ratio.round{box-shadow:0 2px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
#scrim{position:fixed;inset:0;z-index:9}
#menu{position:fixed;z-index:10;min-width:176px;padding:6px;border-radius:20px;background:rgba(28,28,30,.84);border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 36px rgba(0,0,0,.5);opacity:0;transform:scale(.94);transform-origin:var(--ox,50%) var(--oy,100%);transition:opacity .15s,transform .15s}
#menu.open{opacity:1;transform:none}
#menu small{display:block;padding:8px 14px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#menu button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;height:46px;padding:0 14px;border-radius:14px;font-size:15px;font-weight:600;text-align:left}
#menu button:active{background:rgba(255,255,255,.1)}
#menu button[aria-checked="true"]{color:var(--accent)}
#menu button[aria-checked="true"]::after{content:"✓";font-weight:700}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#shutter{position:relative;width:88px;height:88px;border-radius:50%;justify-self:center;padding:0}
#shutter svg{position:absolute;inset:0;transform:rotate(-90deg)}
#shutter .tr{stroke:rgba(255,255,255,.35)}
#shutter .arc{stroke:#fff;transition:stroke-dashoffset .2s,stroke .2s}
#shutter.good .arc{stroke:var(--accent)}
#shutter i{position:absolute;inset:10px;border-radius:50%;background:#fff;transition:transform .1s,background .2s}
#shutter.good i{background:#fff4d0}
#shutter:active i{transform:scale(.9)}
#thumb{justify-self:start;width:54px;height:54px;border-radius:14px;background:#222 center/cover;border:2px solid rgba(255,255,255,.85);position:relative}
#thumb span{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#1a1500;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

#err{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:16px;right:16px;margin:auto;width:fit-content;max-width:calc(100% - 32px);z-index:8;padding:9px 16px;border-radius:999px;background:var(--glass);font-size:13px;font-weight:600;text-align:center;opacity:0;transition:opacity .3s}
#err.show{opacity:1}
#flash{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none}
#flash.on{animation:fl .18s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}

/* gallery */
#sheet{position:fixed;inset:0;z-index:4;background:var(--sheet);color:var(--sheet-fg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 4px calc(env(safe-area-inset-bottom,0px) + 16px)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px 12px}
.bar h2{font-size:18px;font-weight:700}
.link{font-weight:600;font-size:16px;padding:10px 6px;color:var(--accent)}
#list{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
#list button{aspect-ratio:1;background:#1b1d21 center/cover;border-radius:2px;display:block;width:100%}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:60px 0}

#view{position:fixed;inset:0;z-index:5;background:#000;display:flex;flex-direction:column}
#view .top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0}
#view .stage{flex:1;min-height:0;display:grid;place-items:center;padding:8px}
#view img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
#view .bot{padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:14px;align-items:center}
.seg{display:flex;background:#1b1d21;border-radius:999px;padding:3px}
.seg button{padding:8px 18px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:#000}
.seg button:disabled{opacity:.4}
.acts{display:flex;gap:10px;width:100%;max-width:420px}
.acts button{flex:1;padding:14px;border-radius:14px;font-weight:700;font-size:15px;background:var(--accent);color:#1a1500}
.acts button.sec{flex:0 0 auto;background:#1b1d21;color:var(--warn);padding:14px 20px}
/* polish: spacing, alignment, motion */
:root{--ease:cubic-bezier(.22,.8,.3,1);--gutter:20px}
html,body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header{padding:calc(env(safe-area-inset-top,0px) + 14px) var(--gutter) 30px}
.pill{height:40px;padding:0 18px;gap:8px;font-size:14px;letter-spacing:.02em;transition:transform .2s var(--ease),background-color .25s,color .25s,box-shadow .25s}
footer{padding:30px 28px calc(env(safe-area-inset-bottom,0px) + 22px);grid-template-columns:1fr 88px 1fr;column-gap:12px}
#thumb{width:56px;height:56px;border-radius:16px;transition:transform .2s var(--ease)}
#thumb.pop{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.08)}100%{transform:none;opacity:1}}
#ratio.round{width:56px;height:56px;font-size:14px;transition:transform .2s var(--ease)}
#shutter{transition:transform .2s var(--ease)}
#shutter:active{transform:scale(.95)}
#shutter i{transition:transform .18s var(--ease),background-color .25s}
#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transition:opacity .3s var(--ease),transform .3s var(--ease),background-color .25s,color .25s}
#sheet,#view{animation:rise .3s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#list{gap:2px;padding:0 2px}
#list button{border-radius:6px;transition:transform .15s var(--ease),opacity .15s}
#list button:active{transform:scale(.97);opacity:.85}
.link{transition:opacity .15s}
.link:active{opacity:.6}
#view .stage{padding:12px 16px}
#view img{border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
#view .bot{gap:16px;padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 22px)}
.seg button{transition:background-color .2s,color .2s}
.acts{gap:12px}
.acts button{height:52px;padding:0;border-radius:16px;transition:transform .15s var(--ease)}
.acts button.sec{padding:0 24px}
.acts button:active{transform:scale(.97)}
#menu button{transition:background-color .15s}
/* camera controls */
header{display:grid;grid-template-columns:1fr auto 1fr;column-gap:8px}
.grp{display:flex;gap:8px;align-items:center}
.grp.r{justify-content:flex-end}
.ibtn{min-width:40px;width:auto;height:40px;padding:0 12px;gap:5px;font-size:13px;font-weight:700}
.ibtn svg{flex:none}
.ibtn span{font-size:12px;font-weight:700}
.ibtn span:empty{display:none}
.ibtn[aria-pressed="true"]{background:var(--accent);color:#1a1500}
#flip{grid-column:3;justify-self:end;width:56px;height:56px;min-width:0;padding:0;border-radius:50%}
#flip svg{transition:transform .45s var(--ease)}
body.front #v{transform:scaleX(-1)}
#err{top:calc(env(safe-area-inset-top,0px) + 70px)}
#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 214px)}
#zoom{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 158px);z-index:2;display:flex;justify-content:center;align-items:center;gap:8px;pointer-events:none}
#zoom button{pointer-events:auto;min-width:38px;height:38px;padding:0 8px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,255,255,.16);font-size:13px;font-weight:700;transition:transform .2s var(--ease),color .2s,min-width .2s}
#zoom button[aria-pressed="true"]{min-width:46px;height:46px;color:var(--accent)}
#zoom button:active{transform:scale(.94)}
#count{position:fixed;inset:0;z-index:3;display:grid;place-items:center;font-size:132px;font-weight:200;text-shadow:0 2px 28px rgba(0,0,0,.55);pointer-events:none}
#count.pulse{animation:pulse .9s var(--ease)}
@keyframes pulse{0%{opacity:0;transform:scale(1.4)}25%{opacity:1;transform:scale(1)}100%{opacity:.85;transform:scale(.94)}}
#fring{position:fixed;width:72px;height:72px;margin:-36px 0 0 -36px;border:2px solid var(--accent);border-radius:50%;pointer-events:none;z-index:3;opacity:0}
#fring.on{animation:fring 1.2s var(--ease) forwards}
@keyframes fring{0%{opacity:1;transform:scale(1.4)}20%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1)}}
#shutter i{transition:transform .2s var(--ease),background-color .25s,border-radius .2s var(--ease)}
#shutter.timing i{transform:scale(.5);border-radius:14px}
#sheet{touch-action:pan-y}
#inst{position:fixed;top:calc(env(safe-area-inset-top,0px) + 68px);left:50%;transform:translateX(-50%);z-index:3;background:var(--accent);color:#1a1500;min-width:0}
#inst:active{transform:translateX(-50%) scale(.96)}
#err{top:50%;left:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);margin:0;width:min(82%,300px);max-width:none;padding:26px 22px;border-radius:26px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;font-weight:500;line-height:1.45;color:rgba(255,255,255,.75);pointer-events:none;border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 36px rgba(0,0,0,.45)}
#err.show{pointer-events:none}
#err svg{opacity:.8;margin-bottom:2px}
#err b{display:block;font-size:17px;font-weight:700;color:#fff}
#err .ebtn{pointer-events:auto;margin-top:8px;min-height:48px;padding:0 28px;border:0;border-radius:999px;background:#fff;color:#000;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;touch-action:manipulation}
#err .ebtn:active{transform:scale(.97)}
#err .ebtn:disabled{opacity:.6}
#err small{font-size:11px;opacity:.45;margin-top:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#seeLbl{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 84px);text-align:center;z-index:1;pointer-events:none;font:700 30px/1.1 Georgia,'Noto Serif','Times New Roman',serif;color:#ffb347;text-shadow:0 2px 16px rgba(0,0,0,.4),0 0 2px rgba(0,0,0,.25)}
#got{position:fixed;z-index:3;pointer-events:none;border:3px solid #ffd23f;border-radius:10px;object-fit:cover;box-shadow:0 8px 28px rgba(0,0,0,.55)}
#shutter.working i{transform:scale(.72);opacity:.7}
#view .stage img{background:#111}
/* ===== minimal UI ===== */
header{display:flex;justify-content:space-between;align-items:flex-start;column-gap:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 30px;background:linear-gradient(rgba(0,0,0,.3),transparent)}
.grp{display:flex;gap:10px;align-items:center}
.rb{min-width:44px;height:44px;padding:0 12px;border-radius:22px;background:rgba(0,0,0,.34);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:transform .25s var(--ease),background-color .25s,color .25s,opacity .3s}
.rb:active{transform:scale(.9)}
.rb svg{flex:none}
.rb span{font-size:12px;font-weight:700}
.rb span:empty{display:none}
.rb[aria-pressed="true"]{background:var(--accent);color:#1a1500}
#auto::before,#auto::after{content:none!important}
#auto,#auto[aria-pressed]{background:rgba(0,0,0,.34);color:#fff}
#auto{animation:fadeIn .3s var(--ease)}
#szR{transition:all .35s var(--ease)}
#flip{width:52px;height:52px;min-width:0;padding:0;border-radius:50%}
footer{background:linear-gradient(transparent,rgba(0,0,0,.5));padding:26px 28px calc(env(safe-area-inset-bottom,0px) + 20px)}
#thumb{width:52px;height:52px;border-radius:14px;border:2px solid rgba(255,255,255,.9)}
#zoom{bottom:calc(env(safe-area-inset-bottom,0px) + 140px)}
#zoom button{background:rgba(0,0,0,.34);border:0}
#seeLbl{font-size:26px;opacity:0;animation:fadeIn .9s .4s var(--ease) forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#sheet .bar{justify-content:flex-start;padding:6px 10px 10px}
#list button{animation:fadeUp .4s var(--ease) both}
#view .top{justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0}
#vimg{transition:opacity .25s}
.acts{justify-content:center;gap:14px}
.acts button{flex:0 0 auto;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;padding:0}
.acts button:first-child{background:var(--accent);color:#1a1500;width:132px;border-radius:32px}
.acts button.sec{background:#1b1d21;color:var(--warn)}
#inst{background:var(--accent);color:#1a1500;padding:0 18px;font-size:13px;font-weight:700}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay disablepictureinpicture disableremoteplayback poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
<canvas id="g"></canvas>
<div id="seeLbl" aria-hidden="true">What I see</div>
<img id="got" alt="" hidden>

<header>
  <div class="grp">
    <button id="flashBtn" class="rb" aria-pressed="false" aria-haspopup="menu" aria-label="Flash" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M13.5 2 5 13.5h6L10 22l9-12h-6z"/></svg><span id="fLbl"></span></button>
    <button id="timerBtn" class="rb" aria-pressed="false" aria-haspopup="menu" aria-label="Timer"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 2.5h5"/></svg><span id="tLbl"></span></button>

    <button id="gridBtn" class="rb" aria-label="Box shape and size"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect id="szR" x="7.5" y="4.4" width="9" height="11.3" rx="2"/></svg></button>

<div id="zoom" hidden></div>

<div id="flash"></div>
<div id="scrim" hidden></div>

  </div>
</section>

<script>
const $=id=>document.getElementById(id);
const v=$('v'),ov=$('g'),octx=ov.getContext('2d');
const wk=document.createElement('canvas');wk.width=96;wk.height=72;
const wctx=wk.getContext('2d',{willReadFrequently:true});
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));

  let title='Camera disabled',msg,btn='Try again';
  if(n==='NotAllowedError'||n==='SecurityError'){
    let st='prompt';
    try{st=(await navigator.permissions.query({name:'camera'})).state;}catch(x){}
    title='Allow camera access';
    if(st==='denied'){
      msg='Camera is off for '+(app?'this app':'this site')+'. Open Android Settings › Apps › '+(app?'CROPÉ':'Chrome')+' › Permissions › Camera › Allow. It restarts when you come back.';
    }else{

  }else if(n==='Timeout'){title='Waiting for camera';msg='Tap Allow on the permission prompt. If no prompt appeared, tap Try again.';}
  else if(n==='NotFoundError'||n==='OverconstrainedError'){msg='No camera was found on this device.';}
  else if(n==='NotReadableError'){msg='Another app is using the camera. Close it, then try again.';}
  else{msg='The live camera can’t start here.';}
  const html=ic+'<b>'+title+'</b><span>'+msg+'</span><button type="button" class="ebtn" id="ebtn">'+btn+'</button><small>code: '+n+'</small>';
  if(e.dataset.h!==html){
    e.innerHTML=html;e.dataset.h=html;
    $('ebtn').onclick=ev=>{
      ev.stopPropagation();const b=ev.currentTarget;b.disabled=true;setTimeout(()=>{b.disabled=false;},700);

}
async function getStream(){
  const hi=!('ImageCapture' in window);
  const tries=[
    {video:{facingMode:{ideal:facing},width:{ideal:hi?2560:1280},height:{ideal:hi?1440:720},frameRate:{ideal:30,max:30}},audio:false},
    {video:{facingMode:{ideal:facing}},audio:false},
    {video:true,audio:false}
  ];
  let last;
  for(const c of tries){
    try{return await navigator.mediaDevices.getUserMedia(c);}
    catch(e){last=e;if(e.name==='NotAllowedError'||e.name==='SecurityError'||e.name==='NotReadableError')break;}
  }
  throw last;
}
let camBusy=false,camQueued=false,camTok=0;
async function camOnce(tok){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){await camFail({name:'Insecure'});return;}
  if(v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop());
  const wd=setTimeout(()=>{if(tok===camTok&&!v.classList.contains('live'))camFail({name:'Timeout'});},7000);
  let s;
  try{
    s=await getStream();
    if(tok!==camTok){s.getTracks().forEach(t=>t.stop());return;}
    v.muted=true;v.setAttribute('playsinline','');
    v.srcObject=s;await v.play();
    if(tok!==camTok)return;
    v.classList.add('live');
  }catch(e){
    if(s)s.getTracks().forEach(t=>t.stop());
    if(tok!==camTok)return;
    v.srcObject=null;v.classList.remove('live');
    await camFail(e);return;
  }finally{clearTimeout(wd);}
  $('err').classList.remove('show');
  try{setupTrack(s.getVideoTracks()[0]);}catch(e){console.error(e);}
  front=facing==='user';document.body.classList.toggle('front',front);buf=[];
  if(!started){started=true;setInterval(tick,200);requestAnimationFrame(draw);}
}
/* one camera start at a time; force=true (Try again button) replaces a stuck one */
async function startCam(force){
  if(camBusy&&!force){camQueued=true;return;}
  const tok=++camTok;camBusy=true;
  try{
    do{
      camQueued=false;
      await camOnce(tok);
      if(tok!==camTok)return;
      if(v.srcObject&&v.srcObject.active&&v.classList.contains('live')&&front===(facing==='user'))camQueued=false;
    }while(camQueued);
  }finally{if(tok===camTok)camBusy=false;}
}

/* the screen shows a cover-fitted part of the camera frame: work out what part */
function vis(){
  const W=innerWidth,H=innerHeight,vw=v.videoWidth,vh=v.videoHeight;
  const sc=Math.max(W/vw,H/vh),fw=vw*sc,fh=vh*sc,ox=(W-fw)/2,oy=(H-fh)/2;
  return{fw,fh,ox,oy,x0:Math.max(0,-ox/fw),x1:Math.min(1,(W-ox)/fw),y0:Math.max(0,-oy/fh),y1:Math.min(1,(H-oy)/fh)};
}
/* the yellow "What I take" box, in 0..1 frame coordinates, always inside what you can see */
function boxGeom(){
  const V=vis(),r=PRESETS[pi][1],va=v.videoWidth/v.videoHeight;
  let w=PRESETS[pi][0],h=w*va/r;
  const mw=(V.x1-V.x0)*.94,mh=(V.y1-V.y0)*.8;
  if(w>mw){w=mw;h=w*va/r;}
  if(h>mh){h=mh;w=h*r/va;}
  const cx=clamp(box.cx,V.x0+w/2+.01,V.x1-w/2-.01),cy=clamp(box.cy,V.y0+h/2+.01,V.y1-h/2-.01);
  return{cx,cy,w,h,V};
}
const visGeom=V=>({cx:(V.x0+V.x1)/2,cy:(V.y0+V.y1)/2,w:V.x1-V.x0,h:V.y1-V.y0});
/* map a rectangle from camera-preview coordinates onto a photo of another shape */
function toStill(g,va,Ws,Hs){
  const pa=Ws/Hs;let cx=g.cx,cy=g.cy,w=g.w,h=g.h;
  if(Math.abs(va-pa)>=.01){
    if(pa<va){const k=pa/va;cy=.5+(cy-.5)*k;h*=k;}
    else{const k=va/pa;cx=.5+(cx-.5)*k;w*=k;}
  }
  let rw=Math.min(w*Ws,Ws),rh=Math.min(h*Hs,Hs),rx=(cx-w/2)*Ws,ry=(cy-h/2)*Hs;
  rx=clamp(rx,0,Ws-rw);ry=clamp(ry,0,Hs-rh);
  return{x:rx,y:ry,w:rw,h:rh};
}

/* look through the picture for the best-looking spot for the yellow box */
function findSpot(W,H,l,S,gm){
  const W1=W+1,n1=W1*(H+1),II=new Float64Array(n1),IL=new Float64Array(n1),IX=new Float64Array(n1),IY=new Float64Array(n1);
  for(let y=0;y<H;y++){let rs=0,rl=0,rx=0,ry=0;
    for(let x=0;x<W;x++){
      const i=y*W+x,q=S[i];rs+=q;rl+=l[i];rx+=q*x;ry+=q*y;
      const k=(y+1)*W1+x+1,u=y*W1+x+1;
      II[k]=II[u]+rs;IL[k]=IL[u]+rl;IX[k]=IX[u]+rx;IY[k]=IY[u]+ry;
    }}
  const sum=(A,x,y,w,h)=>A[(y+h)*W1+x+w]-A[y*W1+x+w]-A[(y+h)*W1+x]+A[y*W1+x];
  const g=boxGeom(),V=g.V;
  const bw=Math.max(4,Math.round(g.w*W)),bh=Math.max(4,Math.round(g.h*H));
  const x0=Math.max(0,Math.ceil(V.x0*W)),x1=Math.min(W-bw,Math.floor(V.x1*W)-bw);
  const y0=Math.max(0,Math.ceil(V.y0*H)),y1=Math.min(H-bh,Math.floor(V.y1*H)-bh);
  if(x1<x0||y1<y0)return;
  const area=bw*bh;
  const scoreAt=(x,y)=>{
    const si=sum(II,x,y,bw,bh);if(si<=0)return 0;
    const relN=clamp((si/area/(gm+1e-6)-.6)/2.6);                 /* more going on than the rest of the picture */
    const cxw=(sum(IX,x,y,bw,bh)/si-x)/bw,cyw=(sum(IY,x,y,bw,bh)/si-y)/bh;
    let t=9;for(const p of[[1/3,1/3],[2/3,1/3],[1/3,2/3],[2/3,2/3]])t=Math.min(t,Math.hypot(p[0]-cxw,p[1]-cyw));
    const thirds=1-clamp(t/.38);                                     /* subject sits on a third */
    const ml=sum(IL,x,y,bw,bh)/area,expo=1-clamp(Math.max(.22-ml,ml-.82)/.2);   /* not black, not blown out */
    const edge=clamp(Math.min(x,y,W-bw-x,H-bh-y)/(Math.max(W,H)*.04));        /* not glued to the edge */
    return .6*relN+.15*thirds+.15*expo+.1*edge;
  };
  let best=-1,bx=0,by=0;
  for(let y=y0;y<=y1;y+=2)for(let x=x0;x<=x1;x+=2){
    const dd=Math.hypot((x+bw/2)/W-cur.bx,(y+bh/2)/H-cur.by);
    const sc=scoreAt(x,y)+.06*clamp(1-dd/.15);                      /* stay put unless something is clearly better */
    if(sc>best){best=sc;bx=x;by=y;}
  }
  const hereX=clamp(Math.round(cur.bx*W-bw/2),x0,x1),hereY=clamp(Math.round(cur.by*H-bh/2),y0,y1);
  cur.spot=best;
  const jump=best>scoreAt(hereX,hereY)+(cur.force?0:.09);
  cur.force=false;
  if(jump){
    const nx=(bx+bw/2)/W,ny=(by+bh/2)/H;
    if(Math.hypot(nx-cur.bx,ny-cur.by)>.08)pulseT=performance.now();
    cur.bx=nx;cur.by=ny;
  }
}

function tick(){
  if(!v.videoWidth||document.hidden||overlayOpen())return;
  const va=v.videoWidth/v.videoHeight,H=Math.round(Math.sqrt(9600/va)),W=Math.round(H*va);
  if(wk.width!==W||wk.height!==H){wk.width=W;wk.height=H;}
  wctx.drawImage(v,0,0,W,H);
  const d=wctx.getImageData(0,0,W,H).data,N=W*H;
  const l=new Float32Array(N),sat=new Float32Array(N);let sum=0;
  for(let i=0;i<N;i++){
    const r=d[i*4],g=d[i*4+1],b=d[i*4+2];
    l[i]=(.299*r+.587*g+.114*b)/255;sat[i]=(Math.max(r,g,b)-Math.min(r,g,b))/255;sum+=l[i];
  }
  const m=sum/N;lastM=m;autoExpose(m);
  const S=new Float32Array(N);let gs=0,ss=0;
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const i=y*W+x,g=Math.hypot(l[i+1]-l[i-1],l[i+W]-l[i-W]);
    gs+=g;const q=g+.5*Math.abs(l[i]-m)+.35*sat[i];S[i]=q;ss+=q;
  }
  const sharp=gs/((W-2)*(H-2));
  if(auto&&!(drag&&drag.moved))findSpot(W,H,l,S,ss/N);
  const exp=1-clamp(Math.max(.28-m,m-.72)/.25);
  const sh=clamp((sharp-.01)/.03);
  const lev=roll==null?null:clamp(1-Math.abs(roll)/12);
  const parts=[[lev,30,'lev'],[exp,35,'exp'],[sh,35,'sh']].filter(p=>p[0]!==null);
  const raw=100*parts.reduce((a,p)=>a+p[0]*p[1],0)/parts.reduce((a,p)=>a+p[1],0);
  cur.score=cur.score*.5+raw*.5;
  const score=Math.round(cur.score);
  $('arc').style.strokeDashoffset=CIRC*(1-score/100);
  const good=score>=80;
  $('shutter').classList.toggle('good',good);
  if(good&&!wasGood)buzz(15);
  wasGood=good;
}

}

function autoLight(c){
  const x=c.getContext('2d'),id=x.getImageData(0,0,c.width,c.height),d=id.data,hist=new Uint32Array(256);let n=c.width*c.height;
  let sum=0;
  const st=Math.max(1,Math.floor(n/250000))*4;let cnt=0;
  for(let i=0;i<d.length;i+=st){const y=(.299*d[i]+.587*d[i+1]+.114*d[i+2])|0;hist[y]++;sum+=y;cnt++;}
  n=cnt;
  let lo=0,hi=255,a=0;
  while(lo<254&&(a+=hist[lo])<n*.005)lo++;
  a=0;while(hi>1&&(a+=hist[hi])<n*.005)hi--;
  lo=Math.min(lo,50);hi=Math.max(hi,190);
  const mean=clamp((sum/n-lo)/(hi-lo),.02,.98);
  const gm=clamp(Math.log(.48)/Math.log(mean),.55,1.45);
  const lut=new Float32Array(256);
  for(let y=0;y<256;y++){
    let t=Math.pow(clamp((y-lo)/(hi-lo)),gm);
    t=.7*t+.3*t*t*(3-2*t);
    const gain=y?(t*255)/y:1;
    lut[y]=Math.min(2.2,1+(gain-1)*.9);
  }
  for(let i=0;i<d.length;i+=4){
    const k=lut[(.299*d[i]+.587*d[i+1]+.114*d[i+2])|0];
    const r=d[i]*k,g=d[i+1]*k,b=d[i+2]*k,l=.299*r+.587*g+.114*b;
    d[i]=l+(r-l)*1.1;d[i+1]=l+(g-l)*1.1;d[i+2]=l+(b-l)*1.1;
  }
  x.putImageData(id,0,0);
}


/* gentle sharpening for a crisper crop */
function sharpen(c,a){
  const w=c.width,h=c.height,x=c.getContext('2d'),id=x.getImageData(0,0,w,h),p=id.data,o=new Uint8ClampedArray(p),k=4*w;
  for(let y=1;y<h-1;y++){let i=(y*w+1)*4;for(let xx=1;xx<w-1;xx++,i+=4){
    for(let ch=0;ch<3;ch++){const j=i+ch;o[j]=p[j]*(1+4*a)-a*(p[j-4]+p[j+4]+p[j-k]+p[j+k]);}
  }}
  id.data.set(o);x.putImageData(id,0,0);
}

/* full-sensor still photo (ImageCapture): far sharper than a video frame */
async function grabStill(fMP){
  if(!('ImageCapture' in window)||!trk||trk.readyState!=='live')return null;
  try{
    const ic=new ImageCapture(trk);
    if(photoCaps===undefined){
      photoCaps=null;
      try{
        const pc=await ic.getPhotoCapabilities();
        if(pc.imageWidth&&pc.imageHeight&&pc.imageWidth.max&&pc.imageHeight.max)photoCaps={W:pc.imageWidth,H:pc.imageHeight};
      }catch(e){}
    }
    let opts={};
    if(photoCaps){
      const{W,H}=photoCaps,k=Math.min(1,Math.sqrt(fMP/(W.max*H.max)));
      const sn=(r,x)=>Math.max(r.min||0,Math.min(r.max,Math.floor(x/(r.step||1))*(r.step||1)));
      opts=k>=1?{imageWidth:W.max,imageHeight:H.max}:{imageWidth:sn(W,W.max*k),imageHeight:sn(H,H.max*k)};
    }
    let blob;
    try{blob=await ic.takePhoto(opts);}
    catch(e){if(Object.keys(opts).length)blob=await ic.takePhoto({});else throw e;}
    const url=URL.createObjectURL(blob);
    let im;
    try{im=await loadImg(url);}finally{setTimeout(()=>URL.revokeObjectURL(url),3000);}
    const w=im.naturalWidth,h=im.naturalHeight;
    if(!w||!h||(w>h)!==(v.videoWidth>v.videoHeight))return null;
    return{src:im,w,h};
  }catch(e){return null;}
}

/* cut "What I take" (the yellow box) and "What I see" (the whole screen view) out of one photo */
async function processShot(fr,geom,va,Vv){
  const rc=toStill(geom,va,fr.w,fr.h),rs=toStill(Vv,va,fr.w,fr.h);
  const take=document.createElement('canvas');
  take.width=Math.max(1,Math.round(rc.w));take.height=Math.max(1,Math.round(rc.h));
  const tx=take.getContext('2d');tx.imageSmoothingQuality='high';
  tx.drawImage(fr.src,rc.x,rc.y,rc.w,rc.h,0,0,take.width,take.height);
  const see=document.createElement('canvas'),k=Math.min(1,1600/Math.max(rs.w,rs.h));
  see.width=Math.max(1,Math.round(rs.w*k));see.height=Math.max(1,Math.round(rs.h*k));
  see.getContext('2d').drawImage(fr.src,rs.x,rs.y,rs.w,rs.h,0,0,see.width,see.height);
  if(fr.src.src)fr.src.src='';
  await yieldUI();
  try{autoLight(take);}catch(e){}
  if(take.width*take.height<=7e6){await yieldUI();try{sharpen(take,.3);}catch(e){}}
  const[tb,sb]=await Promise.all([blobOf(take,.94),blobOf(see,.86)]);
  const vx=Vv.cx-Vv.w/2,vy=Vv.cy-Vv.h/2;
  return{id:Date.now(),tb,sb,take:URL.createObjectURL(tb),see:URL.createObjectURL(sb),
    geom:{x:(geom.cx-geom.w/2-vx)/Vv.w,y:(geom.cy-geom.h/2-vy)/Vv.h,w:geom.w/Vv.w,h:geom.h/Vv.h}};
}

function flyIn(sh,r){

async function takePhoto(){
  if(!v.videoWidth||busy)return;
  busy=true;$('shutter').classList.add('working');
  try{
    const lit=!!caps.torch&&(flashMode===2||(flashMode===1&&lastM<.22));
    if(lit){await torch(true);await sleep(450);}
    const g=boxGeom(),Vv=visGeom(g.V),va=v.videoWidth/v.videoHeight;
    const rect={x:g.V.ox+(front?1-g.cx:g.cx)*g.V.fw-g.w*g.V.fw/2,y:g.V.oy+g.cy*g.V.fh-g.h*g.V.fh/2,w:g.w*g.V.fw,h:g.h*g.V.fh};
    const geom={cx:g.cx,cy:g.cy,w:g.w,h:g.h};
    const fMP=clamp(3.5e6/(g.w*g.h),8e6,20e6);
    clickSound();buzz(25);
    const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');
    let fr=await grabStill(fMP);
    if(!fr){const c=capture(4096);fr={src:c,w:c.width,h:c.height};}
    if(lit)torch(false);
    const sh=await processShot(fr,geom,va,Vv);
    shots.unshift(sh);dbPut(sh);refreshThumb();flyIn(sh,rect);
    const th=$('thumb');th.classList.remove('pop');void th.offsetWidth;th.classList.add('pop');
    if(!$('sheet').hidden)renderList();
  }catch(e){console.error(e);}
  finally{busy=false;$('shutter').classList.remove('working');}
}

function startTimer(){
  let n=timerSec;const c=$('count');
  $('shutter').classList.add('timing');
  const step=()=>{
    if(n<=0){cancelTimer();takePhoto();return;}
    c.hidden=false;c.textContent=n;c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse');buzz(10);n--;
  };
  step();counting=setInterval(step,1000);
}
function cancelTimer(){
  clearInterval(counting);counting=null;
  $('count').hidden=true;$('shutter').classList.remove('timing');
}

$('shutter').onclick=()=>{
  if(!v.videoWidth){startCam(true);return;}
  if(counting){cancelTimer();return;}
  if(timerSec>0)startTimer();else takePhoto();
};

/* flash */
function updateFlashUI(){
  $('flashBtn').setAttribute('aria-pressed',flashMode!==0);
  $('fLbl').textContent=flashMode===1?'A':'';
}
$('flashBtn').onclick=()=>openMenu($('flashBtn'),'Flash',['Off','Auto','On'],flashMode,i=>{flashMode=i;updateFlashUI();});

/* timer */
$('timerBtn').onclick=()=>openMenu($('timerBtn'),'Timer',['Off','3 seconds','10 seconds'],[0,3,10].indexOf(timerSec),i=>{
  timerSec=[0,3,10][i];
  $('timerBtn').setAttribute('aria-pressed',timerSec>0);
  $('tLbl').textContent=timerSec?timerSec+'s':'';saveSet();
});

/* grid */
function syncBox(){
  const[w,r]=PRESETS[pi],pw=7+(w-.22)/.24*8,ph=pw/r,R=$('szR');
  const set=(k,x)=>{R.setAttribute(k,x.toFixed(1));R.style[k]=x.toFixed(1)+'px';};
  set('width',pw);set('height',ph);set('x',12-pw/2);set('y',12-ph/2);
}
$('gridBtn').onclick=()=>{pi=(pi+1)%PRESETS.length;syncBox();saveSet();buzz(8);};

/* flip camera */
$('flip').onclick=()=>{
  cancelTimer();
  facing=facing==='user'?'environment':'user';
  flipDeg+=180;$('flip').firstElementChild.style.transform=`rotate(${flipDeg}deg)`;
  startCam();
};

/* zoom */
function renderZoom(){
  const zb=$('zoom');
  if(zoomOpts.length<2){zb.hidden=true;return;}
  zb.hidden=false;
  const near=zoomOpts.reduce((a,o)=>Math.abs(o-zoomV)<Math.abs(a-zoomV)?o:a,zoomOpts[0]);
  zb.innerHTML=zoomOpts.map(o=>`<button data-z="${o}" aria-pressed="${o===near}">${fmtZ(o===near?zoomV:o)}</button>`).join('');
}
function applyZoom(z){
  const c=caps.zoom;if(!trk||!c)return;
  zoomV=clamp(z,c.min,c.max);
  trk.applyConstraints({advanced:[{zoom:zoomV}]}).catch(()=>{});
  renderZoom();
}
$('zoom').onclick=e=>{const b=e.target.closest('button');if(b){applyZoom(+b.dataset.z);buzz(8);}};
function setupControls(){
  flashMode=0;updateFlashUI();$('flashBtn').hidden=!caps.torch;
  const z=caps.zoom;
  if(z&&z.max>z.min){
    zoomOpts=[.5,1,2,5].filter(o=>o>=z.min-.01&&o<=z.max+.01);
    zoomV=clamp(1,z.min,z.max);
    trk.applyConstraints({advanced:[{zoom:zoomV}]}).catch(()=>{});
  }else{zoomOpts=[];zoomV=1;}
  renderZoom();
}
const tdist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
addEventListener('touchstart',e=>{
  if(e.touches.length===2&&caps.zoom&&$('sheet').hidden&&$('menu').hidden)pinch={d:tdist(e.touches),z:zoomV};
},{passive:true});
addEventListener('touchmove',e=>{
  if(pinch&&e.touches.length===2){e.preventDefault();pinchAt=Date.now();applyZoom(pinch.z*tdist(e.touches)/pinch.d);}
},{passive:false});
addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null;});

/* tap to focus */
function focusAt(x,y){
  const f=$('fring');f.style.left=x+'px';f.style.top=y+'px';
  f.classList.remove('on');void f.offsetWidth;f.classList.add('on');buzz(8);
  const fm=caps.focusMode;
  if(trk&&fm&&fm.includes('single-shot')){
    const a={focusMode:'single-shot'};
    if(caps.pointsOfInterest)a.pointsOfInterest=[{x:clamp(x/innerWidth),y:clamp(y/innerHeight)}];
    trk.applyConstraints({advanced:[a]}).catch(()=>{});
    clearTimeout(focT);
    focT=setTimeout(()=>{if(fm.includes('continuous'))trk.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});},3000);
  }
}
let drag=null;
v.addEventListener('pointerdown',e=>{
  if(!v.videoWidth||overlayOpen())return;
  const g=boxGeom(),V=g.V,bw=g.w*V.fw,bh=g.h*V.fh,cxp=V.ox+(front?1-g.cx:g.cx)*V.fw,cyp=V.oy+g.cy*V.fh;
  const inside=Math.abs(e.clientX-cxp)<bw/2+18&&Math.abs(e.clientY-cyp)<bh/2+18;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,inside,moved:false};
  if(inside)try{v.setPointerCapture(e.pointerId);}catch(x){}
});
v.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id||!drag.inside||pinch)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;
  drag.moved=true;
  if(auto){auto=false;syncMode();saveSet();}
  const V=vis(),dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  box.cx+=(front?-dx:dx)/V.fw;box.cy+=dy/V.fh;
  const g=boxGeom();box.cx=g.cx;box.cy=g.cy;
  drag.x=e.clientX;drag.y=e.clientY;
});
v.addEventListener('pointerup',e=>{
  const d=drag;drag=null;
  if(!d||e.pointerId!==d.id||d.moved)return;
  if(Date.now()-pinchAt<400||overlayOpen())return;
  if(auto){cur.force=true;pulseT=performance.now();tick();}
  if(!d.inside&&v.videoWidth&&!auto){
    const V=vis();
    box.cx=front?1-(e.clientX-V.ox)/V.fw:(e.clientX-V.ox)/V.fw;box.cy=(e.clientY-V.oy)/V.fh;
    const g=boxGeom();box.cx=g.cx;box.cy=g.cy;
  }
  focusAt(e.clientX,e.clientY);
});
v.addEventListener('pointercancel',()=>{drag=null;});

function openMenu(anchor,title,items,sel,pick){
  const m=$('menu');
  m.innerHTML=`<small>${title}</small>`+items.map((t,i)=>`<button role="menuitemradio" aria-checked="${i===sel}" data-i="${i}">${t}</button>`).join('');
  m.hidden=false;$('scrim').hidden=false;
  const r=anchor.getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight;
  const x=clamp(r.left+r.width/2-w/2,12,innerWidth-w-12),below=r.top<innerHeight/2;
  m.style.left=x+'px';m.style.top=(below?r.bottom+10:r.top-h-10)+'px';
  m.style.setProperty('--ox',(r.left+r.width/2-x)+'px');m.style.setProperty('--oy',below?'0':'100%');
  void m.offsetWidth;m.classList.add('open');
  m.onclick=e=>{const b=e.target.closest('button');if(!b)return;closeMenu();pick(+b.dataset.i);buzz(10);};
}
function closeMenu(){
  const m=$('menu');m.classList.remove('open');$('scrim').hidden=true;
  setTimeout(()=>{if(!m.classList.contains('open'))m.hidden=true;},160);
}
$('scrim').onclick=closeMenu;

function syncMode(){$('auto').hidden=auto;}
$('auto').onclick=()=>{auto=true;cur.force=true;syncMode();saveSet();buzz(10);};

/* gallery */
function renderList(){
  if(!shots.length){$('list').innerHTML='<p class="empty">No photos yet</p>';return;}
  $('list').innerHTML=shots.map((s,i)=>`<button data-i="${i}" aria-label="Open photo ${shots.length-i}" style="background-image:url(${s.take})"></button>`).join('');
}
$('list').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  vi=+b.dataset.i;mode='fix';showView();$('view').hidden=false;
};

let vi=0,mode='fix';
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
/* "What I see" picture: the whole view with the yellow box and the two labels */
async function seeUrl(s){
  if(s.cmp)return s.cmp;
  const im=await loadImg(s.see),w=im.naturalWidth,h=im.naturalHeight,c=document.createElement('canvas');
  c.width=w;c.height=h;
  const x=c.getContext('2d'),g=s.geom,u=w/1000,bw=g.w*w,bh=g.h*h,bx=g.x*w,by=g.y*h;
  x.drawImage(im,0,0);
  x.textAlign='center';x.font=`700 ${Math.round(66*u)}px Georgia,'Noto Serif','Times New Roman',serif`;
  x.shadowColor='rgba(0,0,0,.4)';x.shadowBlur=18*u;x.fillStyle='#ffb347';x.fillText('What I see',w/2,h*.14);
  x.shadowBlur=0;
  x.lineWidth=Math.max(3,6*u);x.strokeStyle='#ffd23f';rr(x,bx,by,bw,bh,10*u);x.stroke();
  x.textAlign='left';x.font=`800 ${Math.round(28*u)}px system-ui,sans-serif`;
  x.lineWidth=5*u;x.strokeStyle='rgba(0,0,0,.45)';x.strokeText('What I take',bx+14*u,by+40*u);
  x.fillStyle='#ffd23f';x.fillText('What I take',bx+14*u,by+40*u);
  const b=await blobOf(c,.92);
  return s.cmp=URL.createObjectURL(b);
}
async function showView(){
  const s=shots[vi];if(!s)return;
  const im=$('vimg');im.style.opacity=0;im.onload=()=>{im.style.opacity=1;};
  $('mFix').setAttribute('aria-pressed',mode==='fix');
  $('mSrc').setAttribute('aria-pressed',mode==='src');
  if(mode==='fix'){$('vimg').src=s.take;return;}
  try{const u=await seeUrl(s);if(shots[vi]===s&&mode==='src')$('vimg').src=u;}catch(e){}
}
$('mFix').onclick=()=>{mode='fix';showView();};
$('mSrc').onclick=()=>{mode='src';showView();};
$('back').onclick=()=>{$('view').hidden=true;renderList();};
$('vdel').onclick=()=>{
  const s=shots[vi];if(!s)return;
  shots.splice(vi,1);dbDel(s.id);
  [s.take,s.see,s.cmp].forEach(u=>{if(u)setTimeout(()=>URL.revokeObjectURL(u),500);});
  refreshThumb();$('view').hidden=true;renderList();
  if(!shots.length)$('sheet').hidden=true;
};
$('vsave').onclick=async()=>{
  const s=shots[vi];if(!s)return;
  try{if(mode==='fix')await save(s.take,'what-i-take');else await save(await seeUrl(s),'what-i-see');}catch(e){}
};

async function save(url,name){
  const b=await (await fetch(url)).blob(),f=new File([b],`crope-${name}-${Date.now()}.jpg`,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f]});return;}catch(e){if(e.name==='AbortError')return;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

$('thumb').onclick=()=>{renderList();$('sheet').hidden=false;};
$('close').onclick=()=>{$('sheet').hidden=true;};

/* photos stay on the phone between sessions */
let db=null;
const dbReady=new Promise(res=>{
  try{
    const r=indexedDB.open('crope',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('shots',{keyPath:'id'});
    r.onsuccess=()=>{db=r.result;res(db);};r.onerror=()=>res(null);
  }catch(e){res(null);}
});
const dbDo=(mode,fn)=>dbReady.then(d=>d&&new Promise(ok=>{
  try{const t=d.transaction('shots',mode),r=fn(t.objectStore('shots'));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ok(null);t.onabort=()=>ok(null);}catch(e){ok(null);}
}));
const dbPut=s=>dbDo('readwrite',st=>st.put({id:s.id,tb:s.tb,sb:s.sb,geom:s.geom}));
const dbDel=id=>dbDo('readwrite',st=>st.delete(id));
dbDo('readonly',st=>st.getAll()).then(rows=>{
  if(!rows||!rows.length)return;
  rows.sort((a,b)=>b.id-a.id);
  const have=new Set(shots.map(x=>x.id));
  for(const r of rows.slice(0,80)){
    if(have.has(r.id))continue;
    shots.push({id:r.id,tb:r.tb,sb:r.sb,geom:r.geom,take:URL.createObjectURL(r.tb),see:URL.createObjectURL(r.sb)});
  }
  shots.sort((a,b)=>b.id-a.id);refreshThumb();
});

let lastDraw=0;
function draw(ts){
  requestAnimationFrame(draw);
  if(ts-lastDraw<33)return;lastDraw=ts;
  const dpr=Math.min(window.devicePixelRatio||1,1.5),W=innerWidth,H=innerHeight;
  if(ov.width!==Math.round(W*dpr)||ov.height!==Math.round(H*dpr)){ov.width=Math.round(W*dpr);ov.height=Math.round(H*dpr);}
  octx.setTransform(dpr,0,0,dpr,0,0);octx.clearRect(0,0,W,H);
  if(!v.videoWidth||overlayOpen())return;
  if(auto&&!(drag&&drag.moved)){box.cx+=(cur.bx-box.cx)*.14;box.cy+=(cur.by-box.cy)*.14;}
  const g=boxGeom(),V=g.V,bw=g.w*V.fw,bh=g.h*V.fh,bx=V.ox+(front?1-g.cx:g.cx)*V.fw-bw/2,by=V.oy+g.cy*V.fh-bh/2;
  octx.save();
  octx.shadowColor=wasGood?'rgba(255,210,63,.75)':'rgba(0,0,0,.35)';octx.shadowBlur=wasGood?16:8;
  const pu=clamp(1-(performance.now()-pulseT)/600);
  octx.lineWidth=3.5+2.5*pu;octx.strokeStyle=wasGood||pu>0?'#ffe066':'#ffd23f';
  rr(octx,bx,by,bw,bh,8);octx.stroke();
  if(pu>0){octx.globalAlpha=pu*.7;octx.lineWidth=2;const e=16*(1-pu);rr(octx,bx-e,by-e,bw+2*e,bh+2*e,8+e);octx.stroke();}
  octx.restore();
  if(bw>86){
    octx.font='800 13px system-ui,sans-serif';octx.textBaseline='alphabetic';
    octx.lineWidth=3.5;octx.strokeStyle='rgba(0,0,0,.45)';octx.strokeText('What I take',bx+10,by+22);
    octx.fillStyle='#ffd23f';octx.fillText('What I take',bx+10,by+22);
  }
  if(roll!=null&&Math.abs(roll)>1){
    const a=-roll*Math.PI/180,ok=Math.abs(roll)<3;
    octx.save();octx.translate(W/2,H/2);octx.rotate(a);
    octx.strokeStyle=ok?'#ffcf4a':'rgba(255,255,255,.85)';octx.lineWidth=2.5;octx.lineCap='round';
    octx.beginPath();octx.moveTo(-60,0);octx.lineTo(-16,0);octx.moveTo(16,0);octx.lineTo(60,0);octx.stroke();
    octx.restore();
  }
}
let swx=null;
$('view').addEventListener('touchstart',e=>{swx=e.touches.length===1?e.touches[0].clientX:null;},{passive:true});
$('view').addEventListener('touchend',e=>{
  if(swx==null)return;
  const dx=e.changedTouches[0].clientX-swx;swx=null;
  if(Math.abs(dx)<70)return;
  const n=vi+(dx<0?1:-1);if(n<0||n>=shots.length)return;
  vi=n;showView();buzz(8);
});
function saveSet(){try{localStorage.setItem('crope.set2',JSON.stringify({pi,auto,timer:timerSec}));}catch(e){}}
(function(){
  if([0,3,10].includes(SAVED.timer))timerSec=SAVED.timer;
  syncBox();
  syncMode();
  $('timerBtn').setAttribute('aria-pressed',timerSec>0);$('tLbl').textContent=timerSec?timerSec+'s':'';
})();
</script>
</body>
